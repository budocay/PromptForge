name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Versions figees : un nouveau black ou ruff ne doit pas rougir la CI
      # sans qu'aucun fichier ait change.
      - run: pip install "ruff==0.15.8" "black==26.3.1"
      - name: ruff
        run: ruff check promptforge/ tests/
      - name: black
        run: black --check promptforge/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[all]"
      # Les tests `integration` appellent OSV.dev ; ceux d'Ollama sont
      # ignores d'eux-memes, aucun Ollama ne tourne sur le runner.
      - name: pytest
        run: pytest tests/ -q -m "not integration"
